name: "1. Generate Keystore and Save Secrets"

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          STORE_PASS="EasyQueasy2024Release!"
          keytool -genkeypair \
            -alias easyqueasy-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -keystore release.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=EasyQueasy, OU=App, O=TroyDiFlex, L=Unknown, S=Unknown, C=RU"
          echo "=== Keystore generated ==="
          keytool -list -v -keystore release.keystore -storepass "$STORE_PASS" | head -20

      - name: Encode keystore and save secrets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          pip install PyNaCl requests --quiet
          KEYSTORE_B64=$(base64 -w 0 release.keystore)
          export KEYSTORE_B64
          python3 << 'PYEOF'
          import os, base64, requests
          from nacl import public, encoding

          token = os.environ["GH_PAT"]
          repo = os.environ["REPO"]
          ks_b64 = os.environ["KEYSTORE_B64"]

          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json"
          }

          r = requests.get(f"https://api.github.com/repos/{repo}/actions/secrets/public-key", headers=headers)
          pk_data = r.json()
          pub_key = public.PublicKey(pk_data["key"].encode(), encoding.Base64Encoder())
          box = public.SealedBox(pub_key)
          key_id = pk_data["key_id"]

          def set_secret(name, value):
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              payload = {"encrypted_value": encrypted, "key_id": key_id}
              resp = requests.put(
                  f"https://api.github.com/repos/{repo}/actions/secrets/{name}",
                  headers=headers,
                  json=payload
              )
              status = "OK" if resp.status_code in (201, 204) else f"ERROR {resp.status_code}: {resp.text}"
              print(f"  {name}: {status}")

          store_pass = "EasyQueasy2024Release!"
          print("Saving secrets...")
          set_secret("KEYSTORE_BASE64", ks_b64)
          set_secret("KEYSTORE_PASSWORD", store_pass)
          set_secret("KEY_ALIAS", "easyqueasy-key")
          set_secret("KEY_PASSWORD", store_pass)
          print("All 4 secrets saved successfully!")
          PYEOF

      - name: Upload keystore as backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: "BACKUP-release-keystore-DO-NOT-DELETE"
          path: release.keystore
          retention-days: 90
